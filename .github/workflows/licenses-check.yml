name: Licenses Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-licenses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate third-party license inventory
        run: npm run licenses:check
